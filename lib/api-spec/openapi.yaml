openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Provider-backed product catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/products:
    get:
      operationId: getCatalogProducts
      tags: [catalog]
      summary: List products from the configured catalog provider
      parameters:
        - name: sort
          in: query
          required: false
          description: Sort all matching products before paging. Omit for catalog order. Missing prices sort last in either price direction; ties use product ID ascending.
          schema:
            type: string
            enum: [name-asc, name-desc, price-asc, price-desc]
        - name: filters
          in: query
          required: false
          description: JSON object mapping facet keys to selected values
          schema:
            type: string
            maxLength: 4000
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of products from the configured provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductPage"
        "400":
          description: Invalid catalog query
        "502":
          description: Catalog provider could not be reached
        "503":
          description: Catalog provider is not configured
  /catalog/categories:
    get:
      operationId: getCatalogCategories
      tags: [catalog]
      summary: List enabled categories from the configured catalog provider
      responses:
        "200":
          description: Enabled product categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCategories"
        "502":
          description: Catalog provider could not be reached
        "503":
          description: Catalog provider is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CatalogProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        priceFormatted:
          type: ["string", "null"]
        inStock:
          type: boolean
        imageUrl:
          type: ["string", "null"]
        productUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - sku
        - price
        - priceFormatted
        - inStock
        - imageUrl
        - productUrl
    CatalogProductPage:
      type: object
      properties:
        facets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogFacet"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset
        - facets
    CatalogFacet:
      type: object
      required: [key, label, options]
      properties:
        key:
          type: string
        label:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/CatalogFacetOption"
    CatalogFacetOption:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
    CatalogCategory:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    CatalogCategories:
      type: array
      items:
        $ref: "#/components/schemas/CatalogCategory"

